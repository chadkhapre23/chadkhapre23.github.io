<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>News Article | JAMES NYARANGO TV</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:'Jost',sans-serif;
background:#f3f4f6;
color:#222;
font-size:18px;
}

header{
background:#101010;
color:white;
padding:15px 5%;
border-bottom:4px solid #d71920;
display:flex;
align-items:center;
gap:18px;
}

header img{
width:80px;
height:65px;
object-fit:contain;
}

header h1{
font-size:25px;
font-weight:800;
margin:0;
}

nav{
background:#171717;
padding:15px 5%;
}

nav a{
color:white;
text-decoration:none;
font-weight:700;
margin-right:20px;
font-size:18px;
}

.container{
max-width:1000px;
margin:35px auto;
padding:0 18px;
}

.article{
background:white;
padding:35px;
box-shadow:0 2px 12px #00000012;
}

.category{
color:#d71920;
font-weight:800;
text-transform:uppercase;
}

.breaking{
display:inline-block;
background:#d71920;
color:white;
padding:6px 12px;
font-weight:800;
margin:12px 0;
}

h2{
font-size:34px;
line-height:1.3;
margin:12px 0;
font-weight:800;
}

.subheadline{
font-size:21px;
color:#555;
line-height:1.6;
}

.details{
font-size:17px;
color:#777;
border-bottom:1px solid #ddd;
padding-bottom:15px;
margin-bottom:20px;
}

.article-image{
width:100%;
max-height:600px;
object-fit:cover;
margin:15px 0 25px;
}

.story{
font-size:20px;
line-height:1.9;
white-space:pre-wrap;
overflow-wrap:anywhere;
}

.back{
display:inline-block;
background:#d71920;
color:white;
text-decoration:none;
padding:12px 20px;
margin-top:25px;
font-weight:800;
}

.message{
background:white;
padding:35px;
text-align:center;
}

footer{
background:#111820;
color:white;
text-align:center;
padding:25px;
margin-top:45px;
border-top:4px solid #d71920;
font-size:17px;
}

@media(max-width:600px){
.article{padding:18px}
h2{font-size:27px}
.story{font-size:18px}
header h1{font-size:19px}
}
</style>
</head>

<body>

<header>
<img src="../JAMO%20LOGO.jpeg" alt="JNTV Logo">
<h1>JAMES NYARANGO TV</h1>
</header>

<nav>
<a href="../index.html">HOME</a>
<a href="latest-news.html">LATEST NEWS</a>
</nav>

<main class="container" id="articleContainer">
<div class="message">Loading article...</div>
</main>

<footer>
<strong>JAMES NYARANGO TV</strong><br>
NEWS • CURRENT AFFAIRS • MEDIA<br><br>
© 2026 JAMES NYARANGO TV. ALL RIGHTS RESERVED.
</footer>

<script>
(function(){

const container=document.getElementById("articleContainer");

function safe(value){
return String(value||"").replace(/[&<>"']/g,function(c){
return {
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[c];
});
}

function getArticles(){
let data=[];

try{
data=JSON.parse(localStorage.getItem("jntvArticles")||"[]");
}catch(error){
data=[];
}

return Array.isArray(data)?data:[];
}

function loadArticle(){

const articles=getArticles();
const params=new URLSearchParams(window.location.search);
const id=params.get("id");

let article=null;

// Find the exact article selected from the homepage.
if(id){
article=articles.find(item=>String(item.id)===String(id));
}

// Also support articles that use another ID field.
if(!article && id){
article=articles.find(item=>
String(item.articleId)===String(id) ||
String(item.newsId)===String(id)
);
}

// If no ID was supplied, show the newest available non-archived article.
if(!article && !id){
article=articles.find(item=>item.archived!==true);
}

if(!article || article.archived===true){

container.innerHTML=`
<div class="message">
<h2>ARTICLE NOT FOUND</h2>
<p>We could not find this news story.</p>
<p>Please return to the homepage and select a published story.</p>
<a class="back" href="../index.html">RETURN TO HOMEPAGE</a>
</div>`;

return;
}

let image="";

if(typeof article.photo==="string" && article.photo.trim()!==""){
image=`
<img class="article-image"
src="${safe(article.photo)}"
alt="${safe(article.headline)}"
onerror="this.style.display='none'">`;
}

const headline=article.headline || article.title || "Untitled News Story";
const story=article.story || article.content || article.description || "";
const category=article.category || "Latest News";
const date=article.date || "";
const author=article.author || article.reporter || "";
const subheadline=article.subheadline || article.summary || "";

container.innerHTML=`
<article class="article">

<div class="category">${safe(category)}</div>

${article.breaking?'<div class="breaking">BREAKING NEWS</div>':''}

<h2>${safe(headline)}</h2>

${subheadline?`<p class="subheadline">${safe(subheadline)}</p>`:''}

<div class="details">
${safe(date)}
${author?' | By '+safe(author):''}
</div>

${image}

<div class="story">${safe(story)}</div>

<a class="back" href="../index.html">BACK TO HOMEPAGE</a>

</article>`;

}

loadArticle();

})();
</script>

</body>
</html>
