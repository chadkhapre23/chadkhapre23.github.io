<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sign In | JAMES NYARANGO TV</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Jost', sans-serif;
    font-size: 18px;
    background: #f3f4f6;
    color: #222;
}

header {
    background: #101010;
    color: white;
    padding: 15px 5%;
    border-bottom: 4px solid #d71920;
}

.brand {
    display: flex;
    align-items: center;
    gap: 15px;
}

.brand img {
    width: 80px;
    height: 70px;
    object-fit: contain;
}

.brand h1 {
    font-size: 25px;
    font-weight: 800;
}

nav {
    background: #171717;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
}

nav a {
    color: white;
    text-decoration: none;
    padding: 15px;
    font-size: 18px;
    font-weight: 600;
}

nav a:hover {
    background: #d71920;
}

.login-section {
    min-height: 650px;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 45px 20px;
}

.login-card {
    width: 100%;
    max-width: 480px;
    background: white;
    padding: 40px;
    box-shadow: 0 5px 25px #00000012;
    border-top: 5px solid #d71920;
}

.login-card h2 {
    font-size: 30px;
    text-align: center;
    margin-bottom: 10px;
}

.login-card .subtitle {
    text-align: center;
    color: #666;
    margin-bottom: 30px;
    font-size: 18px;
}

.form-group {
    margin-bottom: 20px;
}

.form-group label {
    display: block;
    font-weight: 700;
    margin-bottom: 8px;
}

.form-group input {
    width: 100%;
    padding: 14px;
    font-family: 'Jost', sans-serif;
    font-size: 18px;
    border: 1px solid #ccc;
    outline: none;
}

.form-group input:focus {
    border-color: #d71920;
}

.password-wrapper {
    position: relative;
}

.password-wrapper input {
    padding-right: 85px;
}

.show-password {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    border: none;
    background: none;
    color: #d71920;
    font-family: 'Jost', sans-serif;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
}

.forgot {
    text-align: right;
    margin-bottom: 22px;
}

.forgot a {
    color: #d71920;
    text-decoration: none;
    font-weight: 600;
}

.login-button {
    width: 100%;
    padding: 15px;
    background: #d71920;
    color: white;
    border: none;
    font-family: 'Jost', sans-serif;
    font-size: 20px;
    font-weight: 800;
    cursor: pointer;
}

.login-button:hover {
    background: #a90f16;
}

.message {
    margin-top: 18px;
    text-align: center;
    font-size: 18px;
    font-weight: 600;
}

.back-home {
    display: block;
    text-align: center;
    margin-top: 25px;
    color: #222;
    text-decoration: none;
    font-weight: 600;
}

footer {
    background: #111820;
    color: white;
    border-top: 4px solid #d71920;
    text-align: center;
    padding: 30px 15px;
}

footer h2 {
    font-size: 23px;
    margin-bottom: 8px;
}

footer p {
    font-size: 18px;
    color: #ccc;
    margin-top: 8px;
}

@media(max-width:550px) {
    .brand h1 {
        font-size: 20px;
    }

    .brand img {
        width: 65px;
    }

    .login-card {
        padding: 25px 20px;
    }

    nav a {
        padding: 12px 9px;
    }
}
</style>
</head>

<body>

<header>
    <div class="brand">
        <img src="JAMO%20LOGO.jpeg" alt="JNTV Logo">
        <h1>JAMES NYARANGO TV</h1>
    </div>
</header>

<nav>
    <a href="index.html">HOME</a>
    <a href="pages/latest-news.html">LATEST NEWS</a>
    <a href="pages/politics.html">POLITICS</a>
    <a href="pages/business.html">BUSINESS</a>
    <a href="pages/sports.html">SPORTS</a>
    <a href="pages/entertainment.html">ENTERTAINMENT</a>
    <a href="pages/videos.html">VIDEOS</a>
    <a href="pages/about.html">ABOUT US</a>
</nav>

<main class="login-section">

    <div class="login-card">

        <h2>WELCOME BACK</h2>

        <p class="subtitle">
            Sign in to your JNTV account
        </p>

        <form id="loginForm">

            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email address"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <div class="password-wrapper">
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword()">
                        SHOW
                    </button>
                </div>
            </div>

            <div class="forgot">
                <a href="mailto:info@jamesnyarangotv.ac.ug?subject=Password%20Recovery">
                    Forgot Password?
                </a>
            </div>

            <button type="submit" class="login-button">
                SIGN IN
            </button>

            <div class="message" id="message"></div>

        </form>

        <a href="index.html" class="back-home">
            ← Back to Homepage
        </a>

    </div>

</main>

<footer>
    <h2>JAMES NYARANGO TV</h2>
    <p>NEWS • CURRENT AFFAIRS • MEDIA</p>
    <p>© 2026 JAMES NYARANGO TV. ALL RIGHTS RESERVED.</p>
</footer>

<script>
function togglePassword() {
    const password = document.getElementById("password");
    const button = document.querySelector(".show-password");

    if (password.type === "password") {
        password.type = "text";
        button.textContent = "HIDE";
    } else {
        password.type = "password";
        button.textContent = "SHOW";
    }
}

document.getElementById("loginForm").addEventListener("submit", function(event) {
    event.preventDefault();

    document.getElementById("message").textContent =
        "Account authentication is not yet configured.";

    document.getElementById("message").style.color = "#d71920";
});
</script>

</body>
</html>
